[package]
name = "bcs-mcp"
version = "0.1.0"
edition = "2021"
authors = ["BCS Contributors"]
description = "MCP server for Binary Config Schema (agent-safe tools)"
license = "MIT"
repository = "https://github.com/trovante/bcs"

[[bin]]
name = "bcs-mcp"
path = "src/main.rs"

[dependencies]
bcs-core = { path = "../core", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
rmcp = { version = "3.1", features = ["server", "transport-io", "macros", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
