[package]
name = "bcs-secrets"
version = "0.1.0"
edition = "2021"
authors = ["BCS Contributors"]
description = "Optional secret-provider backends for BCS secret references"
license = "MIT"
repository = "https://github.com/trovante/bcs"

[features]
default = []
vault = ["dep:ureq", "dep:base64"]
# OpenBao reuses the Vault HTTP client (BAO_* env with Vault fallbacks).
openbao = ["vault"]
aws = ["dep:ureq", "dep:hmac", "dep:sha2", "dep:hex", "dep:base64"]
azure = ["dep:ureq", "dep:base64"]
gcp = ["dep:ureq", "dep:base64"]
doppler = ["dep:ureq"]
infisical = ["dep:ureq"]
akeyless = ["dep:ureq"]
bitwarden = ["dep:ureq"]
onepassword = []
kubernetes = ["dep:base64"]

[dependencies]
bcs-core = { path = "../core", version = "0.1.0" }
serde_json = "1.0"
ureq = { version = "3.3", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.23", optional = true }

[dev-dependencies]
serde_json = "1.0"
base64 = "0.23"
