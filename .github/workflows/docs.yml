name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'spec/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-doc
        run: cargo install mdbook --version ^0.4

      - name: Generate Rust API docs
        run: cargo doc --no-deps --all-features --workspace

      - name: Create docs directory structure
        run: |
          mkdir -p _site
          mkdir -p _site/api
          mkdir -p _site/spec

      - name: Copy documentation files
        run: |
          cp -r docs/* _site/
          cp README.md _site/index.md
          cp -r spec/* _site/spec/
          cp -r target/doc/* _site/api/

      - name: Create index.html
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Binary Config Schema (BCS) Documentation</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 2rem;
                      line-height: 1.6;
                      color: #333;
                  }
                  h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 0.5rem; }
                  h2 { color: #34495e; margin-top: 2rem; }
                  .section {
                      background: #f8f9fa;
                      padding: 1.5rem;
                      margin: 1rem 0;
                      border-radius: 8px;
                      border-left: 4px solid #3498db;
                  }
                  a {
                      color: #3498db;
                      text-decoration: none;
                      font-weight: 500;
                  }
                  a:hover { text-decoration: underline; }
                  ul { list-style: none; padding-left: 0; }
                  li { padding: 0.5rem 0; }
                  li:before { content: "-> "; color: #3498db; font-weight: bold; }
                  .footer {
                      margin-top: 3rem;
                      padding-top: 2rem;
                      border-top: 1px solid #ddd;
                      text-align: center;
                      color: #7f8c8d;
                  }
              </style>
          </head>
          <body>
              <h1>Binary Config Schema (BCS)</h1>
              <p>High-performance configuration format with O(1) random access, self-describing metadata, and AI-aware semantics.</p>

              <div class="section">
                  <h2>Getting Started</h2>
                  <ul>
                      <li><a href="getting-started.html">Getting Started Guide</a></li>
                      <li><a href="spec/format.html">BCS Format Specification</a></li>
                  </ul>
              </div>

              <div class="section">
                  <h2>API Documentation</h2>
                  <ul>
                      <li><a href="api-reference.html">API Reference</a></li>
                      <li><a href="api/bcs_core/index.html">Rust Core API</a></li>
                      <li><a href="api/bcs_cli/index.html">Rust CLI API</a></li>
                  </ul>
              </div>

              <div class="section">
                  <h2>Examples</h2>
                  <ul>
                      <li><a href="https://github.com/trovante/bcs/tree/main/examples">Example Configurations</a></li>
                  </ul>
              </div>

              <div class="footer">
                  <p>Binary Config Schema is open source. <a href="https://github.com/trovante/bcs">View on GitHub</a></p>
              </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
