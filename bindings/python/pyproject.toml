[project]
name = "bcs"
version = "0.1.0"
description = "Python bindings for Binary Config Schema (via C FFI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BCS Contributors" }]

[project.urls]
Repository = "https://github.com/trovante/bcs"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bcs*"]
